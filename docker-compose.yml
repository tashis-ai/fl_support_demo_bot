# Запуск: docker compose up -d --build

services:
  rag-school-bot:
    build: .
    container_name: rag-school-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_MODE: "3"
      # TELEGRAM_PROXY берётся из .env; на VPS обычно оставляют пустым
    volumes:
      - ./docs:/app/docs:ro
      - ./data/chroma_db:/app/chroma_db
      - ./data/cache.json:/app/cache.json
      - ./data/logs.db:/app/logs.db
    # Long polling — порты наружу не нужны
